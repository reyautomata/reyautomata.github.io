<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de entregables · ReyEngi</title>
<meta name="theme-color" content="#0B1220">
<link rel="icon" type="image/png" href="../../img/favicon.png">
<style>
:root { --bg: #0B1220; --panel: #111D2E; --panel2: #18283C; --fg: #EAF2F8; --muted: #94A9BE; --line: #22364D; --brand: #0E2238; --accent: #FF8C32; --accent-ink: #FFB070; --sel: #38C8E8; --ok: #27B783; --warn: #E6A23C; --bad: #E35B65;
  --f-body: Inter, "Segoe UI", system-ui, sans-serif; --f-mono: ui-monospace, Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--f-body); display: flex; flex-direction: column; }
[hidden] { display: none !important; }
button, .btn { font: 600 12.5px var(--f-body); border-radius: 6px; padding: 6px 11px; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); text-decoration: none; text-align: center; }
button.pri { background: var(--accent); border-color: var(--accent); color: #1b0d02; }
button:hover, .btn:hover { border-color: var(--sel); } button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
input, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
input[readonly] { color: var(--muted); }
.barra { background: var(--brand); border-bottom: 1px solid var(--line); padding: 8px 16px; flex: none; }
.barra .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.barra h1 { margin: 0 auto 0 0; font-size: 16px; }
.barra h1 small { display: block; font: 500 11px var(--f-mono); color: var(--muted); }
main.gu { flex: 1; min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr) 290px; gap: 0; padding-bottom: 22px; }
main.gu.sinizq { grid-template-columns: 0 minmax(0, 1fr) 290px; } main.gu.sinder { grid-template-columns: 270px minmax(0, 1fr) 0; } main.gu.sinizq.sinder { grid-template-columns: 0 minmax(0, 1fr) 0; }
main.gu.sinizq .izq, main.gu.sinder .der { display: none; }
.lado { overflow: auto; background: var(--panel); padding: 10px 12px 16px; min-height: 0; }
.izq { border-right: 1px solid var(--line); } .der { border-left: 1px solid var(--line); }
.lado h2 { font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin: 12px 0 8px; display: flex; gap: 6px; align-items: center; }
.lado h2:first-child { margin-top: 2px; }
.lado h2 i { font-style: normal; color: var(--sel); border: 1px solid var(--sel); border-radius: 50%; width: 16px; height: 16px; display: inline-grid; place-items: center; font-size: 9.5px; }
.lado label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.dato { font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
.dato small { display: block; color: var(--muted); font-size: 11px; }
.centro { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.cinta { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.cinta b { font-size: 12.5px; } .cinta span { color: var(--muted); font-size: 11.5px; margin-right: auto; }
.cinta button { padding: 3px 8px; font-size: 11.5px; }
iframe { flex: 1; width: 100%; border: 0; background: var(--bg); min-height: 300px; }
.sin { margin: auto; max-width: 460px; text-align: center; color: var(--muted); padding: 30px 20px; }
.sin h3 { color: var(--fg); font-size: 16px; margin: 0 0 8px; }
.acc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .acc .pri, .acc .ancho { grid-column: 1 / -1; }
.val { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; }
.val li { padding: 3px 0 3px 18px; position: relative; } .val li::before { content: ""; position: absolute; left: 3px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.val li.w::before { background: var(--warn); } .val li.e::before { background: var(--bad); } .val li.i::before { background: var(--muted); }
.hist { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.hist li { border-left: 2px solid var(--line); padding: 1px 0 7px 9px; overflow-wrap: anywhere; } .hist li small { display: block; color: var(--muted); font: 10.5px var(--f-mono); }
.nota { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }
.msg { font-size: 12px; margin: 8px 0 0; min-height: 17px; color: var(--sel); }
@media (max-width: 1000px) { body { height: auto; } main.gu, main.gu.sinizq, main.gu.sinder { grid-template-columns: minmax(0, 1fr); } .izq, .der { border: 0; border-bottom: 1px solid var(--line); } iframe { height: 70vh; flex: none; } }
</style>
<script src="../acceso.js"></script>
<link rel="stylesheet" href="../suite.css">
<link rel="stylesheet" href="../fluent.css" id="rsFluent">
<script>/* antes de pintar: tema elegido y espacio de la cinta de opciones, para que nada salte al cargar */try{var d=document.documentElement,L=localStorage;if(L.getItem('reyengi-tema')==='claro')d.setAttribute('data-tema','claro');if(window.top===window){d.className+=' rs-pre';d.style.setProperty('--rs-cinta',(+L.getItem('reyengi-cinta-h')||(matchMedia('(max-width:900px)').matches?37:121))+'px')}}catch(e){}</script>
<script src="../proyectos.js" defer></script>
<script src="../entregables.js" defer></script>
<script src="../cinta.js" defer></script>
<script src="../suite.js" defer></script>
<script src="../gestion.js" defer></script>
<script src="../archivos.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="barra"><div class="fila">
  <h1>Generador de entregables <small>Una misma mesa de trabajo para documentos y planos</small></h1>
</div></div>
<main class="gu" id="gu">
  <aside class="lado izq" aria-label="Configuración">
    <h2><i>1</i> Configuración</h2>
    <label>Tipo de entregable<select id="cGen"></select></label>
    <label>Registro<select id="cReg"></select></label>
    <label>Título<input id="cTit" maxlength="160"></label>
    <label>Código de documento<input id="cCod" maxlength="60" placeholder="Por ejemplo RE-001-IN-DL-0001"></label>
    <label>Área<input id="cArea" maxlength="60" placeholder="Por ejemplo 100 · Espesamiento"></label>
    <label>Formato de salida<select id="cFmt"></select></label>
    <div class="dato" id="cProy"></div>
    <div class="dato" id="cDisc"></div>
    <div class="dato" id="cEnt"></div>
  </aside>
  <section class="centro" aria-label="Editor y vista previa">
    <div class="cinta"><button type="button" id="bIzq" aria-pressed="true" title="Mostrar u ocultar la configuración">◧ Configuración</button><b><i style="font-style:normal;color:var(--sel)">2 · 3</i> Editor y vista previa</b><span id="cMod"></span><a class="btn" id="aMod" style="padding:3px 8px;font-size:11.5px">Abrir en su módulo</a><button type="button" id="bDer" aria-pressed="true" title="Mostrar u ocultar acciones e historial">Acciones ◨</button></div>
    <iframe id="marco" title="Editor y vista previa del entregable" hidden></iframe>
    <div class="sin" id="sin" hidden></div>
  </section>
  <aside class="lado der" aria-label="Acciones e historial">
    <h2><i>4</i> Acciones</h2>
    <div class="acc">
      <button type="button" class="pri" id="bExp">Exportar</button>
      <button type="button" id="bVal">Validar</button><button type="button" id="bGen">Generar vista</button>
      <button type="button" id="bGua">Guardar</button><button type="button" id="bRev">Nueva revisión</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <ul class="val" id="val"></ul>
    <h2><i>5</i> Historial</h2>
    <div class="dato" id="hEst"></div>
    <ul class="hist" id="hist"></ul>
  </aside>
</main>
</body>
</html>
