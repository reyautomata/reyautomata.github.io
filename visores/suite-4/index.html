function kindDe(i){if(i.cx.cls==='loc')return null;if(i.cx.cls!=='hw')return 'red';const k=i.t.k;
  if(k==='an'){const a=insAlim(i);return a==='loop'?'ai2':a==='24VDC'?'ai4dc':'ai4ac';}return k;}

  return TIPL.find(x=>x.k===k&&x.t===(i.t.base||i.tipo)&&(!x.a||x.a===insAlim(i)))||TIPL.find(x=>x.k===k&&!x.t)||{c:'GEN',n:'Típico genérico: '+KINDN[k],k};}
function cardDe(i,ty){const o=i.cards&&i.cards[ty];if(o)return o;
  if(ty==='DI')return insAlim(i)==='120VAC'?'DI120':'DI24';if(ty==='DO')return S.reglas.do;return ty;}

    const o={...r,t,cx,num,L,fila:ix+1};

    o.kind=kindDe(o);o.tip=tipicoDe(o);o.tg=S.proy.area+r.tag.replace(/-/g,'');return o;});
  const res=S.reglas.res/100,P=S.plat;
  // tarjetas
  const hw=[];ins.forEach(i=>i.sig.forEach(s=>{if(s.ty!=='RED'){s.card=cardDe(i,s.ty);hw.push(s);}}));
  const cnt={};hw.forEach(s=>cnt[s.card]=(cnt[s.card]||0)+1);
  const mods=[];let slot=1;const base={};
  CKEYS.filter(k=>cnt[k]).forEach(k=>{const ch=CARDS[k][P][1];const m=Math.max(1,Math.ceil(cnt[k]*(1+res)/ch));base[k]=slot;
    for(let j=0;j<m;j++)mods.push({slot:slot+j,key:k,model:CARDS[k][P][0],ch,used:Math.max(0,Math.min(ch,cnt[k]-j*ch))});slot+=m;});
  const idx={},tbn={},fu={};
  hw.forEach(s=>{const k=s.card,c=CARDS[k][P][1];const n=idx[k]=(idx[k]||0);idx[k]++;
    s.slot=base[k]+Math.floor(n/c);s.canal=n%c;s.dir=`RIO-01 · S${s.slot} · C${pad(s.canal)}`;
    const tb=CARDS[k].tb;const b=tbn[tb]||0;tbn[tb]=b+3;s.tb=tb;s.tbn=b+1;const f=(fu[tb]||0)+1;fu[tb]=f;s.fu='FU'+pad(f);});

  const io=[];ins.forEach(i=>{i.io=i.sig.map(s=>{const r={...s,inst:i.tag,desc:i.desc,proto:i.cx.proto,con:i.con};io.push(r);return r;});});
  // cables según típico

function pendientes(p,M){const out=[];VF.forEach(([k,l])=>{if(['proyecto2'].includes(k))return;if(!vv(p.v[k])&&!(p.est!=='keypro'&&false))out.push(['v',k,l]);});

  if(p.est==='keypro'){const ix=out.findIndex(x=>x[1]==='gtproy');if(ix>=0)out.splice(ix,1);}return out;}
V.plano=(M,id)=>{const p=S.planos.find(x=>x.id===id);if(!p)return cab('','Plano no encontrado','');if((p.ent||'laz')!=='laz')return planoOtro(p,M);

  const d=docDe(M,'laz',q=>q.tag===i.tag);const pe=pendientes(p,M);
  return `<div class="plhead">${cab('10 En Trabajo\\12 PLA IN\\05 DIAG LAZOS',`${d?d.code:''} · Lazo ${i.tag}`,`Típico ${esc(i.tip.c)} · ${esc(i.tip.n)}. ${pe.length?`<span class="chip nv">${pe.length} campo(s) pendiente(s)</span>`:'<span class="chip c">Sin pendientes</span>'}`)}
   <div class="row"><button class="btn" data-accion="cajon" aria-expanded="${!S.cajonOff}">${S.cajonOff?'Abrir':'Cerrar'} edición de campos</button><button class="btn pri" data-accion="dxf">Descargar DXF</button><button class="btn" data-borrarplano="${p.id}">Quitar plano</button></div></div>
  <div class="plwrap${S.cajonOff?' sin':''}"><div class="hojaw">${dibujar(p,M)}</div>${S.cajonOff?'':cajon(p,i,M,pe)}</div>

function planoOtro(p,M){const d=docPlano(p,M);const e=ENTI[p.ent];const pe=pendientes(p,M);if(PT==='ins'||PT==='tar')PT='vin';

   <div class="row"><button class="btn" data-accion="cajon" aria-expanded="${!S.cajonOff}">${S.cajonOff?'Abrir':'Cerrar'} edición de campos</button><button class="btn pri" data-accion="dxf">Descargar DXF</button><button class="btn" data-borrarplano="${p.id}">Quitar plano</button></div></div>
  <div class="plwrap${S.cajonOff?' sin':''}"><div class="hojaw">${dibujar(p,M)}</div>${S.cajonOff?'':cajon(p,null,M,pe)}</div>
  <p class="note">Contenido generado desde la base del proyecto; cambia con cada modificación de instrumentos, tarjetas o conexiones.</p>`;}
function cajon(p,i,M,pe){const tabs=i?[['vin','Viñeta'],['ins','Instrumento'],['tar','Típico y tarjetas'],['rev','Revisiones']]:[['vin','Viñeta'],['rev','Revisiones']];
  let body='';
  if(PT==='vin'){const difs=k=>S.planos.filter(q=>q.id!==p.id&&(q.v[k]||'')!==(p.v[k]||'')).length;
    body=`<p class="note">Campos de este plano. Si un campo debe quedar igual en todo el proyecto, usa «A todas».</p>
    ${VF.map(([k,l])=>{const n=difs(k);return `<div class="fld"><label for="pv-${k}">${esc(l)}<input id="pv-${k}" data-pv="${k}" value="${esc(p.v[k]||'')}" class="${vv(p.v[k])?'':'inpend'}"></label>${n?`<button class="btn mini" data-prop="${k}" title="Copiar a las otras ${n} viñetas">A todas (${n})</button>`:''}</div>`}).join('')}
    <label for="pv-tit">Título del plano (vacío = automático)<input id="pv-tit" data-ptit="1" value="${esc(p.tit||'')}" placeholder="${esc(i?(i.tag+' '+i.desc).toUpperCase():'TÍTULO AUTOMÁTICO')}"></label>

  if(PT==='tar'){const opts=TIPL.filter(x=>x.k&&x.t===(i.t.base||i.tipo));

    <label for="pt-con">Conexión<select id="pt-con">${i.t.ok.map(k=>`<option value="${k}" ${k===i.con?'selected':''}>${k} · ${esc(CONEX[k].proto)}</option>`).join('')}</select></label>`;}
  if(PT==='rev'){body=`${tabla([{h:'Rev',k:'n',mono:1},{h:'Fecha',k:'fecha',mono:1},{h:'Descripción',k:'desc'}],p.revs)}
    <div class="form"><label for="nr-n">Rev<input id="nr-n" value="${esc(sigRev(p))}"></label><label for="nr-desc">Descripción<input id="nr-desc" value="${esc(REVD[sigRev(p)]||'EMITIDO PARA CONSTRUCCIÓN')}"></label>
    <label for="nr-por">Proy.<input id="nr-por" value="${esc(ini(p.v.diseno))}"></label><label for="nr-rev">Revisó<input id="nr-rev" value="${esc(ini(p.v.jdisc))}"></label><label for="nr-apr">Aprobó<input id="nr-apr" value="${esc(ini(p.v.jproy))}"></label></div>
    <button class="btn pri" data-accion="nueva-rev">Agregar revisión</button><button class="btn" data-accion="rev-todos">Agregar esta revisión a todos los lazos</button>`;}
  return `<aside class="cajon" aria-label="Edición de campos"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${PT===k}" data-tab="${k}">${l}</button>`).join('')}</div>
   ${pe.length?`<div class="pends"><b>Pendientes</b>${pe.map(([t,k,l])=>`<button class="chip nv" data-ir="${t}:${k}">${esc(l)}</button>`).join(' ')}</div>`:''}<div class="cbody">${body}</div></aside>`;}
const ini=s=>(s||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('.').toUpperCase()+((s||'').trim()?'.':'');
function sigRev(p){const l=(p.revs[p.revs.length-1]||{}).n;const seq=['A','B','C','0','1','2','3'];const j=seq.indexOf(l);return j>=0&&j<seq.length-1?seq[j+1]:'0';}
function nuevoPlano(tag,est,ent,key){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const v={...S.vinG};v.fase=v.fase||('INGENIERÍA DE '+FASES[fi()][1].toUpperCase());
  const r=REVL[S.fase];const hoy=new Date().toLocaleDateString('es-CL');

  S.planos.push(p);return p;}

  ${tabla([{h:'Carpeta',f:r=>`<span class="mono">${esc(r.e.car)}</span>`},{h:'N° plano',f:r=>`<span class="mono">${esc(r.d?r.d.code:'—')}</span>`},{h:'Título',f:r=>esc(r.d?r.d.title:'(sin documento de origen)')},{h:'Rev',f:r=>`<span class="mono">${esc((r.p.revs[r.p.revs.length-1]||{}).n||'')}</span>`},{h:'Pendientes',f:r=>{const n=pendientes(r.p,M).length;return n?`<span class="chip nv">${n}</span>`:'<span class="chip c">0</span>'}},{h:'',f:r=>`<button class="btn mini" data-v="plano:${r.p.id}">Abrir</button>`}],rows.sort((a,b)=>(a.d?a.d.code:'').localeCompare(b.d?b.d.code:'')))}
  ${fal.length?`<div class="card"><h2>Por dibujar</h2>${tabla([{h:'N° plano',f:d=>`<span class="mono">${esc(d.code)}</span>`},{h:'Título',k:'title'},{h:'',f:d=>`<button class="btn mini" data-creardoc="${d.ent}|${esc(d.key)}">Dibujar</button>`}],fal)}</div>`:''}`;};
/* ---- Vistas que vienen de la versión anterior ---- */
function svgArq(M){
  const cols=Object.keys(CONEX).filter(k=>M.grupos[k]);
  const NW=92,NH=40,G=22;let x=30;
  const pos=cols.map(k=>{const n=M.grupos[k].length,w=Math.max(1,n)*(NW+10)-10;const o={k,x,w};x+=w+G;return o;});
  const Wd=Math.max(x+10,720),cx=Wd/2;const Y={scada:20,plc:110,rio:200,con:300,ins:410};
  let s=`<svg viewBox="0 0 ${Wd} 470" width="${Wd}" height="470" role="img" aria-label="Arquitectura de control" class="arq">`;
  const box=(x,y,w,h,t,sub,cls='',attr='')=>`<g ${attr}><rect class="nd ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"></rect><text class="tg" x="${x+w/2}" y="${y+(sub?17:h/2+4)}" text-anchor="middle">${esc(t)}</text>${sub?`<text class="sm" x="${x+w/2}" y="${y+31}" text-anchor="middle">${esc(sub)}</text>`:''}</g>`;
  const l=(x1,y1,x2,y2,c)=>{const m=(y1+y2)/2;return `<path class="l-${c}" d="M${x1} ${y1} V${m} H${x2} V${y2}"></path>`};
  s+=l(cx,Y.scada+NH,cx,Y.plc,'fo')+l(cx,Y.plc+NH,cx,Y.rio,'fo');
  s+=`<text class="sm" x="${cx+8}" y="${Y.plc-14}">${esc(foTxt(1))}</text><text class="sm" x="${cx+8}" y="${Y.rio-14}">${esc(foTxt(0))}</text>`;
  pos.forEach(p=>{const cls=CONEX[p.k].cls;const c=p.x+p.w/2;s+=l(cx,Y.rio+NH,c,Y.con,cls==='loc'?'hw':cls);M.grupos[p.k].forEach((i,j)=>{s+=l(c,Y.con+NH,p.x+j*(NW+10)+NW/2,Y.ins,cls);});});
  s+=box(cx-110,Y.scada,220,NH,'Sala de control','SCADA / HMI / servidor','ctl')+box(cx-90,Y.plc,180,NH,'PLC-01','Sala eléctrica','ctl')+box(cx-90,Y.rio,180,NH,'RIO-01','Gabinete de E/S','ctl');
  pos.forEach(p=>{const c=p.x+p.w/2,w=Math.min(Math.max(p.w,NW),170);s+=box(c-w/2,Y.con,w,NH,p.k,CONEX[p.k].proto.split(' / ')[0]);
    M.grupos[p.k].forEach((i,j)=>{s+=box(p.x+j*(NW+10),Y.ins,NW,NH,i.tag,i.t.n.split(' ')[0],i.tag===S.sel?'sel':'',`class="hit" data-tag="${esc(i.tag)}" tabindex="0" role="button" aria-label="${esc(i.tag)}"`);});});
  return s+'</svg>';}
const leyenda=`<div class="legend"><span>${protoDot('hw')}Cableado 4-20 mA / 24 VDC / 120 VAC</span><span>${protoDot('ff')}Foundation Fieldbus H1</span><span>${protoDot('dp')}Profibus DP</span><span>${protoDot('eth')}EtherNet/IP / Modbus TCP</span><span>${protoDot('fo')}Fibra óptica</span></div>`;

function contenido(id,M){switch(id){

  case 'lio':return tabla([{h:'Señal',k:'tag',mono:1},{h:'Instrumento',f:r=>tagChip(r.inst)},{h:'Tipo',k:'ty',mono:1},{h:'Tarjeta',f:r=>r.card?esc(CARDS[r.card][S.plat][0].split(' ·')[0]):'—'},{h:'Dirección',k:'dir',mono:1},{h:'Bornera',f:r=>r.tb?`<span class="mono">${r.tb}:${r.tbn}</span>`:'—'},{h:'Protocolo',k:'proto'}],M.io);

  case 'crt':return `<p>El contenido sale de <button class="cd" data-v="crit">Bases típicas › Criterio de diseño I&C</button> (${CRIT.length} requisitos consolidados).</p>`;

function render(){
  const M=modelo();
  document.getElementById('pc').textContent=`${S.proy.cod} · ${S.proy.cliente}`;document.getElementById('pn').textContent=S.proy.nombre;

  pintaArbol(M);const v=S.vista;
  const html=v.startsWith('ent:')?vistaEnt(v.slice(4),M):v.startsWith('plano:')?V.plano(M,v.slice(6)):(V[v]||V.ficha)(M);

function llenaIns(){const t=document.getElementById('i-tipo'),c=document.getElementById('i-con'),a=document.getElementById('i-alim');if(!t)return;
  c.innerHTML=TIPOS[t.value].ok.map(k=>`<option value="${k}">${k} · ${esc(CONEX[k].proto)}</option>`).join('');a.innerHTML=TIPOS[t.value].alims.map(k=>`<option value="${k}">${esc(ALIMN[k]||k)}</option>`).join('');}
function ir(v){S.vista=v;save();render();document.getElementById('main').scrollIntoView({block:'start'});}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4200);}
const planoAct=()=>S.vista.startsWith('plano:')?S.planos.find(p=>p.id===S.vista.slice(6)):null;
const insDe=tag=>S.ins.find(x=>x.tag===tag);
function crearPlano(tag,est){const ex=S.planos.find(p=>(p.ent||'laz')==='laz'&&p.tag===tag);if(ex)return ex;return nuevoPlano(tag,est);}
function crearDoc(ent,key,est){if(ent==='laz')return crearPlano(key,est);const ex=S.planos.find(p=>p.ent===ent&&p.key===key);if(ex)return ex;return nuevoPlano(null,est,ent,key);}
const tienePlano=d=>S.planos.some(p=>(p.ent||'laz')===d.ent&&(d.ent==='laz'?p.tag===d.key:p.key===d.key));
function crearTodos(est){const M=modelo();let n=0;M.docs.filter(d=>ENTI[d.ent].g==='PLA'&&ENTI[d.ent].f[fi()]>0&&d.key).forEach(d=>{if(!tienePlano(d)){crearDoc(d.ent,d.key,est);n++;}});return n;}

document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let el;
  if((el=q('button[data-f]'))&&FASES.some(f=>f[0]===el.dataset.f)){S.fase=el.dataset.f;save();render();return;}
  if(el=q('[data-fodel]')){S.fo.splice(+el.dataset.fodel,1);save();render();toast('Enlace quitado: diagrama de fibra, arquitectura y circuitos recalculados.');return;}
  if(el=q('[data-tab]')){PT=el.dataset.tab;render();return;}
  if(el=q('[data-ir]')){const [t,k]=el.dataset.ir.split(':');PT=t==='v'?'vin':'ins';render();const inp=document.getElementById((t==='v'?'pv-':'pi-')+k);if(inp){inp.focus();inp.scrollIntoView({block:'center'});}return;}
  if(el=q('svg.hoja .pend[data-f]')){PT='vin';S.cajonOff=false;render();const inp=document.getElementById('pv-'+el.dataset.f);if(inp)inp.focus();return;}
  if(el=q('[data-del]')){S.ins=S.ins.filter(i=>i.tag!==el.dataset.del);save();render();toast(`${el.dataset.del} quitado. Planos y listados recalculados.`);return;}
  if(el=q('[data-borrarplano]')){S.planos=S.planos.filter(p=>p.id!==el.dataset.borrarplano);ir('nuevo');return;}
  if(el=q('[data-creardoc]')){const [en,ke]=el.dataset.creardoc.split('|');const p=crearDoc(en,ke);save();ir('plano:'+p.id);toast('Plano creado.');return;}
  if(el=q('[data-crear]')){const p=crearPlano(el.dataset.crear);save();ir('plano:'+p.id);toast(`Plano de ${p.tag} creado.`);return;}
  if(el=q('[data-prop]')){const p=planoAct(),k=el.dataset.prop;S.planos.forEach(x=>x.v[k]=p.v[k]);S.vinG[k]=p.v[k];save();render();toast(`«${VF.find(f=>f[0]===k)[1]}» actualizado en ${S.planos.length} viñetas.`);return;}

    if(a==='crear-otro'){const sel=document.getElementById('w-doc');if(sel){const [en,ke]=sel.value.split('|');const pl=crearDoc(en,ke,W8.est);pl.est=W8.est;save();ir('plano:'+pl.id);toast('Plano creado.');}}
    if(a==='crear-todos'){const M=modelo();let n=0;M.ins.filter(i=>i.kind).forEach(i=>{if(!S.planos.some(p=>p.tag===i.tag)){nuevoPlano(i.tag,W8.est);n++;}});save();render();toast(`${n} planos de lazo creados.`);}

    if(a==='prop-todo'){VF.forEach(([k])=>{S.planos.forEach(x=>x.v[k]=p.v[k]);S.vinG[k]=p.v[k];});save();render();toast(`Viñeta aplicada a los ${S.planos.length} planos del proyecto.`);}
    if(a==='impacto'){const nv=document.getElementById('pi-tag').value.trim().toUpperCase();if(!/^[A-Z]{1,5}-\d{2,5}[A-Z]?$/.test(nv)){toast('Escribe el tag con formato ISA, por ejemplo PIT-1650.');return;}
      if(nv===p.tag)return;if(S.ins.some(i=>i.tag===nv)){toast(`${nv} ya existe en la base.`);return;}
      const M=modelo();RN={old:p.tag,nuevo:nv,docs:(M.traza[p.tag]||[]).filter(x=>!x.plano),planos:S.planos.filter(x=>x.tag===p.tag).length};render();}
    if(a==='cancelar-rn'){RN=null;render();}
    if(a==='renombrar'&&RN){const o=RN.old,nv=RN.nuevo;S.ins.forEach(i=>{if(i.tag===o)i.tag=nv;});S.planos.forEach(x=>{if(x.tag===o)x.tag=nv;});if(S.sel===o)S.sel=nv;const n=RN.docs.length;RN=null;save();render();toast(`${o} → ${nv}: ${n} documentos y sus planos actualizados.`);}
    if(a==='nueva-rev'||a==='rev-todos'){const g=id=>document.getElementById(id).value.trim();const r={n:g('nr-n'),fecha:new Date().toLocaleDateString('es-CL'),por:g('nr-por'),rev:g('nr-rev'),apr:g('nr-apr'),desc:g('nr-desc').toUpperCase()};
      (a==='rev-todos'?S.planos:[p]).forEach(x=>x.revs.push({...r}));save();render();toast(a==='rev-todos'?`Revisión ${r.n} agregada a ${S.planos.length} lazos.`:`Revisión ${r.n} agregada.`);}
    return;}
  if(el=q('[data-tag]')){S.sel=el.dataset.tag;ir('traza');return;}
  if(el=q('[data-v]')){ir(el.dataset.v);return;}
  if(el=q('input[type=radio][name^="vin-"]')){S.vin[el.name.slice(4)]=el.value;save();render();return;}
  if(el=q('input[name="w-est"]')){W8.est=el.value;return;}
  if(el=q('input[name="w-tip"]')){const i=insDe(W8.tag);if(i&&el.value){i.alim=el.value;save();render();}return;}

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-tag]')){e.preventDefault();S.sel=e.target.dataset.tag;ir('traza');}});
document.addEventListener('change',e=>{const t=e.target,p=planoAct();

  if(t.id==='r-res'){S.reglas.res=Math.max(0,Math.min(50,+t.value||0));save();render();return;}
  if(t.id==='r-do'){S.reglas.do=t.value;save();render();return;}
  if(t.dataset.p){S.proy[t.dataset.p]=t.value.trim()||DEF.proy[t.dataset.p];save();render();return;}
  if(t.dataset.g){S.vinG[t.dataset.g]=t.value.trim();save();render();return;}
  if(t.dataset.pv&&p){p.v[t.dataset.pv]=t.value.trim();save();render();const n=document.getElementById('pv-'+t.dataset.pv);return;}
  if(t.dataset.ptit&&p){p.tit=t.value.trim();save();render();return;}
  if(t.dataset.pi&&p){insDe(p.tag)[t.dataset.pi]=t.value.trim();save();render();return;}
});
document.addEventListener('submit',e=>{if(e.target.id!=='fins')return;e.preventDefault();
  const g=id=>document.getElementById(id).value.trim();const tag=g('i-tag').toUpperCase(),err=document.getElementById('ierr');

  if(S.ins.some(i=>i.tag===tag)){err.textContent=`${tag} ya está en el proyecto.`;err.hidden=false;return;}

if(!S.planos.length){const p0=nuevoPlano("PIT-1610");S.vista="plano:"+p0.id;}
