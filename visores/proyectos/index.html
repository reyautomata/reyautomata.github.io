<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyectos · ReyEngi</title>
<meta name="theme-color" content="#022A55">
<link rel="icon" type="image/png" href="../../img/favicon.png">
<style>
:root { --bg: #07111F; --panel: #0F2036; --fg: #E6EDF5; --muted: #A9B6C6; --line: #1E3350; --brand: #022A55; --accent: #EF5A05; --accent-ink: #FF8A45;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; }
[hidden] { display: none !important; }
button, .btn { font: 600 14px var(--f-body); border-radius: 8px; padding: 9px 14px; min-height: 40px; cursor: pointer; border: 1.5px solid var(--line); background: transparent; color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.pri, .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
button:hover, .btn:hover { border-color: var(--accent); }
button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.barra { position: sticky; top: 0; z-index: 10; background: var(--brand); border-bottom: 4px solid var(--accent); padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
.barra .fila { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.barra h1 { margin: 0 auto 0 0; font-size: 19px; }
.barra h1 small { display: block; font: 500 12px var(--f-mono); color: var(--muted); }
.barra a.volver { color: var(--muted); font: 600 13px var(--f-mono); text-decoration: none; }
main { max-width: 1240px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.lista { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 90px; }
@media (max-width: 820px) { .lista { position: static; } }
.lista h2 { margin: 2px 4px 4px; font: 600 12px var(--f-mono); color: var(--accent-ink); text-transform: uppercase; letter-spacing: 1px; }
.proy { text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; }
.proy small { font: 500 12px var(--f-mono); color: var(--muted); }
.proy[aria-current="true"] { border-color: var(--accent); background: #13263F; }
.acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.acciones button { justify-content: center; font-size: 13px; }
.nota { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 4px 4px 0; }
form { display: flex; flex-direction: column; gap: 16px; }
fieldset { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; background: var(--panel); }
legend { font: 600 12px var(--f-mono); color: var(--accent-ink); text-transform: uppercase; letter-spacing: 1px; padding: 0 6px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
label.ancho { grid-column: 1 / -1; }
input, textarea { min-height: 38px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px 10px; font: 14px var(--f-body); }
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.calc { font: 600 14px var(--f-mono); color: var(--fg); padding-top: 9px; }
.estado { font: 500 12.5px var(--f-mono); color: var(--muted); }
.cab { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.cab h2 { margin: 0; font-size: 22px; }
</style>
</head>
<body>
<div class="barra"><div class="fila">
  <a class="volver" href="../">← Visores 3D</a>
  <h1>Proyectos <small>Datos comunes para hojas de datos y especificaciones técnicas</small></h1>
  <a class="btn" href="../hojas-datos/">Hojas de datos</a>
  <a class="btn pri" href="../especificaciones/">Especificaciones técnicas</a>
</div></div>
<main>
  <aside class="lista" aria-label="Lista de proyectos">
    <h2>Mis proyectos</h2>
    <div id="lista" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="acciones">
      <button type="button" id="nuevo">+ Nuevo</button>
      <button type="button" id="duplicar">Duplicar</button>
      <button type="button" id="exportar">Exportar</button>
      <button type="button" id="importar">Importar</button>
      <button type="button" id="eliminar" style="grid-column:1/-1">Eliminar proyecto</button>
    </div>
    <input type="file" id="archivo" accept=".json,application/json" hidden>
    <p class="nota">Los proyectos se guardan en este navegador. Usa Exportar para respaldarlos o llevarlos a otro equipo.</p>
  </aside>
  <section>
    <div class="cab"><h2 id="titulo">Proyecto</h2><span class="estado" id="estado">Los cambios se guardan solos</span></div>
    <form id="frm" autocomplete="off" style="margin-top:14px"></form>
  </section>
</main>
<script src="../proyectos.js"></script>
<script>
(function () {
  'use strict';
  var R = window.REProyectos, $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function pintarLista() {
    var a = R.activoId();
    $('lista').innerHTML = R.lista().map(function (p) {
      return '<button type="button" class="proy" data-id="' + esc(p.id) + '" aria-current="' + (p.id === a) + '"><span>' + esc(p.nombre) + '</span><small>' + esc(p.numero) + '</small></button>';
    }).join('');
    $('eliminar').disabled = R.lista().length < 2 && false;
  }
  function pintarForm() {
    var d = R.activo();
    $('titulo').textContent = d.nombre || 'Proyecto';
    $('frm').innerHTML = R.GRUPOS.map(function (g) {
      return '<fieldset><legend>' + esc(g.g) + '</legend>' + g.campos.map(function (c) {
        var cls = c.ancho ? ' class="ancho"' : '';
        if (c.t === 'trio') return '<label' + cls + '>' + esc(c.l) + '<span class="trio">' + c.ks.map(function (k) { return '<input name="' + k + '" value="' + esc(d[k]) + '" aria-label="' + esc(c.l + ' ' + k) + '">'; }).join('') + '</span></label>';
        if (c.t === 'calc') return '<label' + cls + '>' + esc(c.l) + '<span class="calc" id="patm">' + esc(R.presionBarometrica(d.altura)) + '</span></label>';
        if (c.t === 'area') return '<label' + cls + '>' + esc(c.l) + '<textarea name="' + c.k + '">' + esc(d[c.k]) + '</textarea></label>';
        return '<label' + cls + '>' + esc(c.l) + '<input name="' + c.k + '" value="' + esc(d[c.k]) + '"></label>';
      }).join('') + '</fieldset>';
    }).join('');
  }
  function todo() { pintarLista(); pintarForm(); }

  var t = 0;
  $('frm').addEventListener('input', function (e) {
    var d = R.activo(), id = d.id;
    Array.prototype.forEach.call($('frm').elements, function (el) { if (el.name) d[el.name] = el.value; });
    delete d.id;
    R.guardar(id, d);
    if (e.target.name === 'altura') $('patm').textContent = R.presionBarometrica(e.target.value);
    if (e.target.name === 'nombre' || e.target.name === 'numero') { pintarLista(); $('titulo').textContent = d.nombre; }
    $('estado').textContent = 'Guardando…'; clearTimeout(t); t = setTimeout(function () { $('estado').textContent = 'Cambios guardados en este navegador'; }, 500);
  });
  $('lista').addEventListener('click', function (e) { var b = e.target.closest('.proy'); if (b) { R.seleccionar(b.dataset.id); todo(); } });
  $('nuevo').addEventListener('click', function () { var n = window.prompt('Nombre del proyecto nuevo:', 'Proyecto nuevo'); if (n) { R.crear(n.trim()); todo(); } });
  $('duplicar').addEventListener('click', function () { var d = R.activo(); R.crear((d.nombre || 'Proyecto') + ' (copia)', d.id); todo(); });
  $('eliminar').addEventListener('click', function () {
    var d = R.activo();
    if (window.confirm('¿Eliminar "' + d.nombre + '" con sus hojas de datos y especificaciones? No se puede deshacer.')) { R.eliminar(d.id); todo(); }
  });
  $('exportar').addEventListener('click', function () {
    var d = R.activo(), url = URL.createObjectURL(new Blob([R.exportar(d.id)], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = 'proyecto-' + (d.numero || d.nombre || 'reyengi').replace(/[^\w-]+/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });
  $('importar').addEventListener('click', function () { $('archivo').click(); });
  $('archivo').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    f.text().then(function (txt) { R.importar(txt); todo(); $('estado').textContent = 'Proyecto importado'; })
      .catch(function (err) { window.alert('No se pudo importar: ' + err.message); });
    this.value = '';
  });
  todo();
})();
</script>
</body>
</html>
